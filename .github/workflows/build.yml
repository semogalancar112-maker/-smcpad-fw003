name: Build SMC-PAD open firmware (fw003) + SmcPadFx sketch

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

env:
  # Upstream open-smc-pad pinned commit (audited layout fw003).
  UPSTREAM_REPO: https://github.com/fedepaj/open-smc-pad.git
  UPSTREAM_SHA: 21cc306a10fe1c5c53e6828100d84b32396cae44

  # JieLi toolchain + post-build tools (from JieLi, pinned by SHA-256).
  TOOLCHAIN_URL: https://jl-update.oss-cn-shenzhen.aliyuncs.com/jieli-linux-toolchains-20260730.1.tar.xz
  TOOLCHAIN_SHA256: a1545cddbc451a06bac43eb5cd96d831470c42a97c5c0b1f98879a20fc7647bd
  POSTBUILD_URL: https://jl-update.oss-cn-shenzhen.aliyuncs.com/jieli-linux-post-build-tools-20260923.1.tar.xz
  POSTBUILD_SHA256: 6949d48c4cd82e274d7943d4ca67f214593fdb4f699ef9f51c2ecc78125ab739

  # Versi paket Arduino platform.
  VERSION: 0.1.0-fw003

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Versi build
        id: vars
        run: echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout kit repo (ini: patches, sketch, tools, workflow)
        uses: actions/checkout@v4

      - name: Checkout upstream open-smc-pad @ SHA + submodules
        run: |
          git init upstream
          git -C upstream remote add upstream "${UPSTREAM_REPO}"
          git -C upstream fetch --depth 1 upstream "${UPSTREAM_SHA}"
          git -C upstream checkout -b fw003-build "${UPSTREAM_SHA}"
          git -C upstream submodule update --init --depth 1 \
            sdk/fw-AC63_BT_SDK third_party/tinyusb third_party/ArduinoCore-API

      - name: Salin kit ke upstream (patch, sketch, tools)
        run: |
          cp patches/fw003.py upstream/patches/fw003.py
          cp -r sketch upstream/arduino/sketches/SmcPadFx
          cp tools/build_fw003_artifacts.py upstream/tools/build_fw003_artifacts.py
          ls -la upstream/

      - name: Terapkan patch fw003
        working-directory: upstream
        run: python3 patches/fw003.py .

      - name: Unduh toolchain + post-build (dari JieLi, verifikasi SHA)
        run: |
          mkdir -p upstream/tools/jl-toolchain upstream/tools/jl-postbuild
          curl -sfL -o tc.tar.xz "${TOOLCHAIN_URL}"
          echo "${TOOLCHAIN_SHA256}  tc.tar.xz" | sha256sum -c
          curl -sfL -o pb.tar.xz "${POSTBUILD_URL}"
          echo "${POSTBUILD_SHA256}  pb.tar.xz" | sha256sum -c
          tar -xJf tc.tar.xz -C upstream/tools/jl-toolchain
          tar -xJf pb.tar.xz -C upstream/tools/jl-postbuild

      - name: Build firmware (arduino runtime, TinyUSB, TEXT_BASE 0x1E08120)
        working-directory: upstream
        run: |
          SMCPAD_ARDUINO=1 SMCPAD_TINYUSB=1 TEXT_BASE=0x1E08120 fw/build.sh

      - name: Build bootloader + installer
        working-directory: upstream
        run: |
          fw/boot/build.sh

      - name: Compile sketch SmcPadFx (verifikasi platform)
        uses: arduino/setup-arduino-cli@v2
        with:
          arduino-cli-version: latest
        working-directory: upstream
        run: |
          arduino/release/build_platform.sh "${VERSION}" dist
          python3 arduino/release/make_index.py "${VERSION}" dist \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            > dist/package_smcpad_index.json
          (cd dist && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          arduino-cli core update-index --additional-urls http://127.0.0.1:8000/package_smcpad_index.json
          arduino-cli core install smcpad:br25 --additional-urls http://127.0.0.1:8000
          arduino-cli compile --fqbn smcpad:br25:smcpad --build-path work/flash/sketch-build arduino/sketches/SmcPadFx

      - name: Bangun artefak fw003 (zip untuk pemasang)
        working-directory: upstream
        run: |
          python3 tools/build_fw003_artifacts.py \
            --out dist/smc-pad-fw003-artifacts.zip \
            --boot-bin fw/boot/out/boot.bin \
            --install-bin fw/boot/out/install.bin \
            --sketch-bin work/flash/sketch-build/SmcPadFx.bin

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: smc-pad-fw003-artifacts
          path: upstream/dist/smc-pad-fw003-artifacts.zip

      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" upstream/dist/smc-pad-fw003-artifacts.zip \
            --title "SMC-PAD open firmware fw003 + SmcPadFx ${VERSION}" \
            --generate-notes
